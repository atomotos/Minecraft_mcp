[project]
name = "minecraft-mcp"
version = "0.2.0"
description = "Autonomous Minecraft Java Edition MCP Server 2.0 with Procedural Construction Engine & Multi-Agent Architectural Guild"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Antigravity & AtomOtos" }
]
keywords = [
    "minecraft",
    "mcp",
    "model-context-protocol",
    "fabric",
    "llm",
    "procedural-generation",
    "multi-agent",
    "greedy-meshing",
    "spatial-intelligence"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "websockets>=12.0",
]

[project.scripts]
minecraft-mcp = "minecraft_mcp:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
